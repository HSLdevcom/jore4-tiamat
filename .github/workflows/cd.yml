name: CD

on:
  push:
    branches:
      - main
      - releases/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run_java_tests:
    name: Run Java tests
    uses: ./.github/workflows/run-java-tests.yml

  publish_docker_image_to_acr:
    needs:
      - run_java_tests
    name: Publish Docker image to ACR
    permissions:
      id-token: write
      contents: read
    uses: HSLdevcom/jore4-tools/.github/workflows/shared-build-and-publish-docker-image.yml@main
    with:
      docker_image_name: jore4-tiamat
      build_arm64_image: true
      file: tiamat-app/Dockerfile
    secrets:
      azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  run_cypress_tests:
    name: Run E2E tests
    needs:
      - run_java_tests
      - publish_docker_image_to_acr
    uses: HSLdevcom/jore4-tools/.github/workflows/shared-run-e2e.yml@use-main-db
    with:
      tiamat_version: "${{ needs.publish_docker_image_to_acr.outputs.docker_image }}"
      hasura_version: "crjore4prod001.azurecr.io/jore4-hsl-hasura:main-metadata-2026-11-24-13131c5215768bfcbc9638c89ac43646967b46ba"
      cypress_version: 'crjore4prod001.azurecr.io/jore4-cypress:use-main-db-2026-11-25-8031b9c198da2e3b2b75de33674e2a711c4799bd'
      custom_docker_compose: ".github/docker-compose.ci.yml"
      test-tags: ''
